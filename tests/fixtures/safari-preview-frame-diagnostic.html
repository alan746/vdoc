<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>VDoc preview frame diagnostic</title>
<style>body{font:16px system-ui;max-width:1000px;margin:24px auto;padding:0 16px}iframe{width:100%;height:360px;border:1px solid #777}pre{white-space:pre-wrap;background:#eee;padding:12px}button{padding:8px 16px}</style>
<h1>Preview frame loading check</h1>
<p>This diagnostic loads the same local preview route without opening the editor. It does not read or change saved documents, send document content, or trigger printing.</p>
<button id="retry" type="button">Reload diagnostic frame</button>
<pre id="status" role="status" aria-live="polite"></pre>
<div id="host"></div>
<script>
(() => {
  const status = document.getElementById('status');
  const host = document.getElementById('host');
  let frame, timer, started;
  const log = message => { status.textContent += `${Math.round(performance.now()-started)} ms: ${message}\n`; };
  const inspect = () => {
    try {
      const doc = frame.contentDocument;
      log(`Frame URL: ${frame.contentWindow.location.href}`);
      log(`Document state: ${doc?.readyState || 'unavailable'}; preview root present: ${Boolean(doc?.getElementById('preview-pages'))}`);
    } catch(error) { log(`Frame inspection failed: ${error.name}`); }
  };
  window.addEventListener('message', event => {
    if (event.source !== frame?.contentWindow || event.origin !== location.origin) return;
    if (event.data?.type === 'vdoc-preview-ready') {
      clearTimeout(timer);
      log('Preview application ready handshake received. No document sent.');
      inspect();
    }
  });
  function start() {
    clearTimeout(timer); started = performance.now(); status.textContent = '';
    frame = document.createElement('iframe'); frame.title = 'Diagnostic local preview frame';
    frame.addEventListener('load', () => { log('Frame load event received.'); inspect(); });
    frame.addEventListener('error', () => log('Frame error event received.'));
    frame.src = '/print-preview';
    log(`Loading ${new URL(frame.src).href}`); host.replaceChildren(frame);
    timer = setTimeout(() => { log('No preview ready handshake within 60 seconds.'); inspect(); }, 60000);
  }
  document.getElementById('retry').addEventListener('click', start);
  start();
})();
</script>
</html>
