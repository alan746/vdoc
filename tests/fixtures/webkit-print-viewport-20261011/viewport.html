<!doctype html><html><head><meta charset="utf-8"><title>VDoc isolated print viewport QA</title><style>html,body{margin:0;padding:0;font:16px Arial} @page{size:A4;margin:0} section{width:100vw;height:100vh;position:relative;break-after:page;break-inside:avoid;box-sizing:border-box;border:1px solid #555} section:last-child{break-after:auto} header{position:absolute;top:20mm;left:20mm} footer{position:absolute;bottom:20mm;left:20mm} p{margin:0} </style></head><body><section><header><h1>PAGE 1 OF 2</h1><p>START_1 English 中文 العربية 日本語</p></header><footer>END_1 footer</footer></section><section><header><h1>PAGE 2 OF 2</h1><p>START_2 English 中文 العربية 日本語</p></header><footer>END_2 footer</footer></section><script>
function snapshot(phase){const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};window.webkit.messageHandlers.qa.postMessage({phase,print:matchMedia('print').matches,innerWidth,innerHeight,dpr:devicePixelRatio,root:rect(document.documentElement),body:rect(document.body),pages:[...document.querySelectorAll('section')].map(rect)});}
addEventListener('load',()=>snapshot('load'));addEventListener('beforeprint',()=>snapshot('beforeprint'));addEventListener('afterprint',()=>snapshot('afterprint'));matchMedia('print').addEventListener('change',()=>snapshot('media-change'));
</script></body></html>
